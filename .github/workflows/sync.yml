name: Sync HF daily papers

on:
  schedule:
    - cron: '20 * * * *' # 每小时第 20 分钟（UTC）
  workflow_dispatch: # 允许在 GitHub 网页上手动运行

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node sync.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hf-papers.json
          git diff --cached --quiet || (git commit -m "Update HF papers" && git push)
      - name: Purge jsDelivr cache
        # 小程序云函数通过 jsDelivr 读取数据，更新后清掉 CDN 缓存，让新数据马上生效
        run: curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/hf-papers.json" || true
